name: Flutter

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  release-scripts:
    # The Play upload script's decisions (tracks, refusal messages), so a
    # release does not find a mistake there after a full build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check scripts/play_upload.ts
      - run: deno test scripts/play_upload_test.ts

  # Every push to the default branch that passes analyze + tests is deployed
  # to Vercel production. Other branches get the checks only: Vercel's free
  # plan allows 100 deployments a day across the whole team, and per-branch
  # previews used it up.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/deploy-web.yml
    secrets: inherit

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: web, os: ubuntu-latest, cmd: "flutter build web --release --no-web-resources-cdn" }
          - { target: android, os: ubuntu-latest, cmd: "flutter build apk --release" }
          - { target: linux, os: ubuntu-latest, cmd: "flutter build linux --release" }
          - { target: ios, os: macos-latest, cmd: "flutter build ios --release --no-codesign" }
          - { target: macos, os: macos-latest, cmd: "flutter build macos --release" }
          - { target: windows, os: windows-latest, cmd: "flutter build windows --release" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: "17"
      - name: Linux desktop dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: ${{ matrix.cmd }}
