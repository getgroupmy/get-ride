name: Flutter

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned, in every workflow: a new stable must not reach a release
          # build unannounced (five plugins still apply the Kotlin Gradle
          # plugin that future Flutter drops). Bump all seven together,
          # through a PR, so CI tries it first. See docs/store-release.md.
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  release-scripts:
    # The Play upload script's decisions (tracks, refusal messages), so a
    # release does not find a mistake there after a full build; and the
    # web deploy's app-link files and domain registration, and the
    # *.getride.my subdomain proxy worker and its wildcard DNS record
    # (cloudflare-worker.yml), whose first real run is a production deploy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check scripts/play_upload.ts scripts/ci/app_links.ts scripts/ci/vercel_domains.ts scripts/ci/cloudflare_wildcard.ts cloudflare/subdomain-proxy/route_test.ts cloudflare/session-proxy/relay_test.ts
      - run: deno test scripts/play_upload_test.ts scripts/ci/app_links_test.ts scripts/ci/vercel_domains_test.ts scripts/ci/cloudflare_wildcard_test.ts cloudflare/subdomain-proxy/route_test.ts cloudflare/session-proxy/relay_test.ts
      # The web app's security headers (deploy/vercel_output_config.json) and
      # the visitor stats script (web/stats.js, deploy/nas-stats).
      - run: deno test --allow-read=deploy,web scripts/ci/vercel_config_test.ts scripts/ci/web_stats_test.ts

  # Every push to the default branch that passes analyze + tests is deployed
  # to Vercel production. Other branches get the checks only: Vercel's free
  # plan allows 100 deployments a day across the whole team, and per-branch
  # previews used it up. This job is the *only* thing that publishes the
  # site: vercel.json turns off Vercel's own Git deploys, which on every
  # merge published an unbuilt (all-404) copy of main to production until
  # this job replaced it minutes later.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/deploy-web.yml
    secrets: inherit

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: web, os: ubuntu-latest, cmd: "flutter build web --release --no-web-resources-cdn" }
          - { target: android, os: ubuntu-latest, cmd: "flutter build apk --release" }
          - { target: linux, os: ubuntu-latest, cmd: "flutter build linux --release" }
          - { target: ios, os: macos-latest, cmd: "flutter build ios --release --no-codesign" }
          - { target: macos, os: macos-latest, cmd: "flutter build macos --release" }
          - { target: windows, os: windows-latest, cmd: "flutter build windows --release" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: "17"
      - name: Linux desktop dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: ${{ matrix.cmd }}
      # Play makes every foreground service type be declared and justified.
      # GET.ride calls are voice only, so the camera type a call plugin brings
      # is removed in AndroidManifest.xml; this keeps it from coming back.
      - name: No camera foreground service in the APK
        if: matrix.target == 'android'
        run: |
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          manifest=$("$aapt2" dump xmltree --file AndroidManifest.xml build/app/outputs/flutter-apk/app-release.apk)
          if grep -q 'FOREGROUND_SERVICE_CAMERA' <<<"$manifest"; then
            echo "::error::The APK asks for FOREGROUND_SERVICE_CAMERA again."
            exit 1
          fi
          # The call service's foregroundServiceType, in whichever base aapt2
          # prints it; camera is the 0x40 bit (phoneCall 0x4, microphone 0x80).
          type=$(grep -A12 'CallkitNotificationService' <<<"$manifest" \
            | grep -m1 'foregroundServiceType' | grep -oE '(0x[0-9a-fA-F]+|[0-9]+)$' || true)
          echo "call service foregroundServiceType: ${type:-not found}"
          if [ -z "$type" ] || (( type & 0x40 )); then
            echo "::error::The call service declares a camera foreground service type (or none was found)."
            exit 1
          fi
          grep -o 'android.permission.FOREGROUND_SERVICE[A-Z_]*' <<<"$manifest" | sort -u
      # The launcher entries are the AppIcon_ aliases only (one per home-screen
      # icon): MainActivity's own, kept in src/main for the Flutter tool, is
      # taken out by the build-type manifests, or the phone shows two icons.
      - name: Launcher entries are the app icon aliases
        if: matrix.target == 'android'
        run: |
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$aapt2" dump xmltree --file AndroidManifest.xml build/app/outputs/flutter-apk/app-release.apk > manifest.txt
          python3 - <<'EOF'
          import re
          launchers, name, depth = set(), None, None
          for line in open("manifest.txt"):
              indent = len(line) - len(line.lstrip())
              if depth is not None and indent <= depth:
                  name, depth = None, None
              if re.search(r"E: (activity|activity-alias) ", line):
                  name, depth = "", indent
              elif depth is not None and name == "" and ":name(" in line:
                  name = re.search(r'="([^"]+)"', line).group(1)
              elif depth is not None and "android.intent.category.LAUNCHER" in line:
                  launchers.add(name)
          print("launcher entries:", sorted(launchers))
          bad = [n for n in launchers if ".AppIcon_" not in n]
          if bad or not any(n.endswith(".AppIcon_standard") for n in launchers):
              raise SystemExit(f"::error::Launcher entries other than the AppIcon_ aliases: {bad}")
          EOF
