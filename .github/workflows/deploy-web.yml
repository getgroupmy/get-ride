name: Deploy web

# Builds the Flutter web app and ships it to Vercel, as the last step of CI
# (`flutter.yml` calls this once `flutter analyze` and the tests pass on a
# push to the default branch, `main`): production. Other branches and pull
# requests get the checks only, to stay inside Vercel's free-plan limit of
# 100 deployments a day per team. Runnable by hand from the Actions tab
# too; on a branch other than `main` that makes a preview.
#
# Vercel has no Flutter builder, so the site is built here and uploaded with
# the Build Output API (`vercel deploy --prebuilt`) -- Vercel only serves it.
#
# The only credential is the VERCEL_TOKEN secret. The org and project ids
# are identifiers, not credentials, so they are written down below; a
# secret or repository variable of the same name overrides them. Without
# the token the deploy skips with a notice instead of failing.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A newer push supersedes an in-flight deploy of the same branch.
    concurrency:
      group: deploy-web-${{ github.ref }}
      cancel-in-progress: true
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID || 'team_EBG91tunYkCckYh5bCELGRU3' }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID || 'prj_P1tZDFvZfEFMT7z84MtAVd1sa80b' }}
      VERCEL_ENV: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'production' || 'preview' }}
    steps:
      - name: Check for Vercel secrets
        id: secrets
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel secrets are not set; skipping the web deploy."
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.present == 'true'

      - uses: subosito/flutter-action@v2
        if: steps.secrets.outputs.present == 'true'
        with:
          channel: stable
          cache: true

      - name: Build
        if: steps.secrets.outputs.present == 'true'
        run: |
          flutter pub get
          flutter build web --release --no-web-resources-cdn

      - name: Link the Vercel project
        if: steps.secrets.outputs.present == 'true'
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment="$VERCEL_ENV" --token="$VERCEL_TOKEN"

      - name: Assemble Vercel build output
        if: steps.secrets.outputs.present == 'true'
        run: |
          rm -rf .vercel/output
          mkdir -p .vercel/output
          cp -r build/web .vercel/output/static
          # Serve real files first, then hand every other path to the app so
          # deep links and refreshes reach the router instead of a 404. Vercel's
          # own /_vercel/* endpoints (Speed Insights) are left alone.
          cat > .vercel/output/config.json <<'JSON'
          {
            "version": 3,
            "routes": [
              { "src": "/(flutter_service_worker\\.js|index\\.html)", "headers": { "cache-control": "no-cache" }, "continue": true },
              { "handle": "filesystem" },
              { "src": "/(?!_vercel/).*", "dest": "/index.html" }
            ]
          }
          JSON

      - name: Deploy
        id: deploy
        if: steps.secrets.outputs.present == 'true'
        run: |
          # Retried: one lost packet talking to Vercel's API must not turn a
          # passing CI run red. A retry makes a second deployment of the same
          # prebuilt output, so the alias lands on an identical copy.
          if [ "$VERCEL_ENV" = production ]; then
            url=$(scripts/ci/retry.sh -o "$RUNNER_TEMP/vercel-url.txt" \
                    vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")
          else
            url=$(scripts/ci/retry.sh -o "$RUNNER_TEMP/vercel-url.txt" \
                    vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN")
          fi
          url=$(tail -1 <<<"$url")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed ($VERCEL_ENV): $url" >> "$GITHUB_STEP_SUMMARY"
