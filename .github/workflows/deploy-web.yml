name: Deploy web

# Builds the Flutter web app and ships it to Vercel: production on every push
# to main, a preview for each pull request from this repository.
#
# Vercel has no Flutter builder, so the site is built here and uploaded with
# the Build Output API (`vercel deploy --prebuilt`) — Vercel only serves it.
# Skips cleanly until the VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID
# repository secrets are added.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Fork PRs get no secrets, so there is nothing to deploy with.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ENV: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') && 'production' || 'preview' }}
    steps:
      - name: Check for Vercel secrets
        id: secrets
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel secrets are not set; skipping the web deploy."
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.present == 'true'

      - uses: subosito/flutter-action@v2
        if: steps.secrets.outputs.present == 'true'
        with:
          channel: stable
          cache: true

      - name: Build
        if: steps.secrets.outputs.present == 'true'
        run: |
          flutter pub get
          flutter build web --release --no-web-resources-cdn

      - name: Link the Vercel project
        if: steps.secrets.outputs.present == 'true'
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment="$VERCEL_ENV" --token="$VERCEL_TOKEN"

      - name: Assemble Vercel build output
        if: steps.secrets.outputs.present == 'true'
        run: |
          rm -rf .vercel/output
          mkdir -p .vercel/output
          cp -r build/web .vercel/output/static
          # Serve real files first, then hand every other path to the app so
          # deep links and refreshes reach the router instead of a 404. Vercel's
          # own /_vercel/* endpoints (Speed Insights) are left alone.
          cat > .vercel/output/config.json <<'JSON'
          {
            "version": 3,
            "routes": [
              { "src": "/(flutter_service_worker\\.js|index\\.html)", "headers": { "cache-control": "no-cache" }, "continue": true },
              { "handle": "filesystem" },
              { "src": "/(?!_vercel/).*", "dest": "/index.html" }
            ]
          }
          JSON

      - name: Deploy
        id: deploy
        if: steps.secrets.outputs.present == 'true'
        run: |
          if [ "$VERCEL_ENV" = production ]; then
            url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          else
            url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed ($VERCEL_ENV): $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL
        if: steps.secrets.outputs.present == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- vercel-preview -->';
            const body = `${marker}\nWeb preview: ${process.env.URL}\n\nBuilt from ${context.sha.slice(0, 7)}.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
