name: Deploy web

# Builds the Flutter web app and ships it to Vercel, as the last step of CI
# (`flutter.yml` calls this once `flutter analyze` and the tests pass on a
# push to the default branch, `main`): production. Other branches and pull
# requests get the checks only, to stay inside Vercel's free-plan limit of
# 100 deployments a day per team. Runnable by hand from the Actions tab
# too; on a branch other than `main` that makes a preview.
#
# Vercel has no Flutter builder, so the site is built here and uploaded with
# the Build Output API (`vercel deploy --prebuilt`) -- Vercel only serves it.
#
# The site also serves qr.getride.my, the host My QR codes point at
# (lib/src/core/my_qr.dart). What makes a phone camera open the app on
# those codes rather than the browser is done here:
#
#   * /.well-known/apple-app-site-association and assetlinks.json, written
#     by scripts/ci/app_links.ts from the signing material the release
#     workflows already have (IOS_PROVISIONING_PROFILE for the team id,
#     ANDROID_KEYSTORE_BASE64 for the upload key's fingerprint) plus the
#     optional repository variables (or secrets) APPLE_TEAM_ID and
#     ANDROID_APP_LINK_SHA256 (the Play App Signing key). A file whose
#     inputs are missing is skipped with a notice.
#
# qr.getride.my itself is not attached here: any *.getride.my subdomain is
# served by the Cloudflare worker in cloudflare/subdomain-proxy (deployed by
# cloudflare-worker.yml), which fetches each request from the production
# host and answers it under the visitor's subdomain. deploy/domains.txt is
# only for domains that must be on the Vercel project itself (e.g. another
# apex): on a production deploy scripts/ci/vercel_domains.ts adds any listed
# domain the project lacks and creates its DNS record (or warns with the
# record to add). It never fails the deploy, and an empty list is fine.
#
# See docs/store-release.md, "App links".
#
# The only credential is the VERCEL_TOKEN secret. The org and project ids
# are identifiers, not credentials, so they are written down below; a
# secret or repository variable of the same name overrides them. Without
# the token the deploy skips with a notice instead of failing.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A newer push supersedes an in-flight deploy of the same branch.
    concurrency:
      group: deploy-web-${{ github.ref }}
      cancel-in-progress: true
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID || 'team_EBG91tunYkCckYh5bCELGRU3' }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID || 'prj_P1tZDFvZfEFMT7z84MtAVd1sa80b' }}
      VERCEL_ENV: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'production' || 'preview' }}
    steps:
      - name: Check for Vercel secrets
        id: secrets
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel secrets are not set; skipping the web deploy."
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.present == 'true'

      - uses: subosito/flutter-action@v2
        if: steps.secrets.outputs.present == 'true'
        with:
          channel: stable
          cache: true

      - uses: denoland/setup-deno@v2
        if: steps.secrets.outputs.present == 'true'
        with:
          deno-version: v2.x

      - name: Build
        if: steps.secrets.outputs.present == 'true'
        run: |
          flutter pub get
          flutter build web --release --no-web-resources-cdn

      - name: Link the Vercel project
        if: steps.secrets.outputs.present == 'true'
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment="$VERCEL_ENV" --token="$VERCEL_TOKEN"

      - name: Assemble Vercel build output
        if: steps.secrets.outputs.present == 'true'
        run: |
          rm -rf .vercel/output
          mkdir -p .vercel/output
          cp -r build/web .vercel/output/static
          # Serve real files first, then hand every other path to the app so
          # deep links and refreshes reach the router instead of a 404. Vercel's
          # own /_vercel/* endpoints (Speed Insights) are left alone. /privacy
          # is a static page (web/privacy.html), linked from the apps and the
          # store listings, so it gets its clean URL here rather than the app.
          # Every response carries the security headers: no framing by other
          # sites (clickjacking on the admin pages), no MIME sniffing, HTTPS
          # only, a trimmed referrer, and the camera, microphone and location
          # for this site alone. The content policy stops there on purpose: the
          # app loads maps, Supabase, payment pages and APIs from many hosts,
          # and a script/connect allow-list would break it for no real gain.
          # /.well-known/ (the app-link files, next step) is real files or a
          # 404, never the app: a phone asking for apple-app-site-association
          # and handed index.html would cache "no app" for this host. The
          # Apple file has no extension, so its JSON type is set here.
          # qr.getride.my/<ref|me|now>/<token> reaches the app like any path.
          cat > .vercel/output/config.json <<'JSON'
          {
            "version": 3,
            "routes": [
              {
                "src": "/.*",
                "headers": {
                  "content-security-policy": "frame-ancestors 'none'; base-uri 'self'; object-src 'none'",
                  "x-frame-options": "DENY",
                  "x-content-type-options": "nosniff",
                  "referrer-policy": "strict-origin-when-cross-origin",
                  "strict-transport-security": "max-age=31536000",
                  "permissions-policy": "camera=(self), microphone=(self), geolocation=(self), payment=(self), usb=(), interest-cohort=()"
                },
                "continue": true
              },
              { "src": "/(flutter_service_worker\\.js|index\\.html)", "headers": { "cache-control": "no-cache" }, "continue": true },
              { "src": "/\\.well-known/apple-app-site-association", "headers": { "content-type": "application/json", "cache-control": "max-age=3600" }, "continue": true },
              { "src": "/\\.well-known/assetlinks\\.json", "headers": { "content-type": "application/json", "cache-control": "max-age=3600" }, "continue": true },
              { "src": "/privacy/?", "dest": "/privacy.html" },
              { "handle": "filesystem" },
              { "src": "/(?!_vercel/|\\.well-known/).*", "dest": "/index.html" }
            ]
          }
          JSON

      # Never in the way of the deploy: without these files the links still
      # work, on the web app. Secrets are decoded into the runner's temp
      # directory and removed; only public values (a team id, certificate
      # fingerprints) reach the files and the log.
      - name: App link files
        if: steps.secrets.outputs.present == 'true'
        continue-on-error: true
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # Fingerprints and team ids are not secret, so a repository
          # variable is the natural home; a secret of the same name works too.
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
          ANDROID_APP_LINK_SHA256: ${{ vars.ANDROID_APP_LINK_SHA256 || secrets.ANDROID_APP_LINK_SHA256 }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/app-links"
          rm -rf "$work" && mkdir -p "$work"
          trap 'rm -rf "$work"' EXIT

          # The team id is in the signed plist inside the profile. -noverify
          # -nosigs: this only reads it; Apple's chain is not on the runner.
          if [ -n "$IOS_PROVISIONING_PROFILE" ]; then
            if printf '%s' "$IOS_PROVISIONING_PROFILE" | base64 -d > "$work/profile.mobileprovision" 2>/dev/null &&
               openssl cms -verify -noverify -nosigs -inform der \
                 -in "$work/profile.mobileprovision" -out "$work/profile.plist" 2>/dev/null; then
              export APP_LINKS_PROFILE_PLIST="$work/profile.plist"
            else
              echo "::warning::IOS_PROVISIONING_PROFILE could not be decoded; falling back to APPLE_TEAM_ID."
            fi
          fi

          # The upload key's fingerprint, as android-release.yml prints it.
          # The password goes by environment, never on the command line.
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$work/upload.jks"
            if keytool -list -v -keystore "$work/upload.jks" \
                 -storepass:env ANDROID_KEYSTORE_PASSWORD > "$work/keytool.txt" 2>&1; then
              export APP_LINKS_KEYTOOL="$work/keytool.txt"
            else
              echo "::warning::The upload keystore could not be read; assetlinks.json uses ANDROID_APP_LINK_SHA256 only."
            fi
          fi

          out=.vercel/output/static/.well-known
          deno run --allow-read --allow-write --allow-env scripts/ci/app_links.ts "$out"

          # The Apple file has no extension: give it its type as a static
          # file too, not only through the route header.
          if [ -f "$out/apple-app-site-association" ]; then
            jq '.overrides = {".well-known/apple-app-site-association": {"contentType": "application/json"}}' \
              .vercel/output/config.json > "$work/config.json"
            mv "$work/config.json" .vercel/output/config.json
          fi

      - name: Deploy
        id: deploy
        if: steps.secrets.outputs.present == 'true'
        run: |
          # Retried: one lost packet talking to Vercel's API must not turn a
          # passing CI run red. A retry makes a second deployment of the same
          # prebuilt output, so the alias lands on an identical copy.
          if [ "$VERCEL_ENV" = production ]; then
            url=$(scripts/ci/retry.sh -o "$RUNNER_TEMP/vercel-url.txt" \
                    vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")
          else
            url=$(scripts/ci/retry.sh -o "$RUNNER_TEMP/vercel-url.txt" \
                    vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN")
          fi
          url=$(tail -1 <<<"$url")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed ($VERCEL_ENV): $url" >> "$GITHUB_STEP_SUMMARY"

      # deploy/domains.txt: add any listed domain the project lacks (never
      # a *.getride.my subdomain: the worker serves those) and point its
      # DNS here when Vercel runs the zone, or
      # on Cloudflare when the optional CLOUDFLARE_API_TOKEN secret is set
      # (a token scoped to Zone -> DNS -> Edit on that zone). Production
      # only; warns rather than fails.
      - name: Domains
        if: steps.secrets.outputs.present == 'true' && env.VERCEL_ENV == 'production'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          deno run --allow-read --allow-env --allow-net=api.vercel.com,api.cloudflare.com \
            --allow-write="$GITHUB_STEP_SUMMARY" \
            scripts/ci/vercel_domains.ts deploy/domains.txt
