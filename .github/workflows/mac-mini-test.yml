name: GET RIDE Mac Mini Test

on:
  workflow_dispatch:

jobs:
  mac-mini-test:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15

    steps:
      - name: Check Mac mini
        run: |
          hostname
          uname -m
          sw_vers

      - name: Check Flutter
        run: /opt/homebrew/share/flutter/bin/flutter --version

      - name: Check Xcode
        run: xcodebuild -version

      - name: Check Android SDK
        run: |
          test -d "$HOME/Library/Android/sdk"
          echo "Android SDK found"
