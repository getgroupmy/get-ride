name: Backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  migrations:
    name: Migration numbers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./supabase/check-migration-numbers.sh

  migrations-replay:
    name: Migrations replay
    # Builds a fresh database from supabase/migrations/ + seed.sql, exactly
    # what a Supabase preview branch or `supabase db reset` does, then runs
    # the SQL regression tests on it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v3
        with:
          version: 2.119.0
      - run: supabase db start
      # What a migration (run as postgres) cannot do and Supabase support
      # does once on the hosted project: take pg_net away from anon and
      # authenticated (0240). supabase/tests/net_grants.sql checks it. The
      # local stack's superuser has the local stack's password.
      - name: pg_net lock-down (superuser, see 0240)
        run: |
          psql "postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 \
            -c "select public.net_api_roles_revoke()"
      - name: SQL tests
        run: |
          for t in supabase/tests/*.sql; do
            echo "::group::$t"
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f "$t"
            echo "::endgroup::"
          done

  edge-functions:
    name: Edge-function tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test supabase/functions
