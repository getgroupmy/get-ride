name: Backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  migrations:
    name: Migration numbers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./supabase/check-migration-numbers.sh

  edge-functions:
    name: Edge-function tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test supabase/functions
