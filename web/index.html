<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <script>
    // Links shared before the switch to path URLs look like /#/rides; move
    // them onto the real path before the app starts so they still open.
    if (location.hash.indexOf('#/') === 0) {
      history.replaceState(null, '', location.hash.slice(1) || '/');
    }
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="GET.ride — for web, desktop, iOS and Android">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GET.ride">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GET.ride</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Vercel Web Analytics and Speed Insights (the script-tag forms of
    @vercel/analytics and @vercel/speed-insights, for sites that aren't built
    with npm). Vercel serves each script once that feature is enabled for the
    project; anywhere else it is simply absent and its queue stays a no-op.
  -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>

  <!--
    First-load skeleton: what shows while the browser downloads the app,
    instead of a blank page. A grey outline of the home map and its sheet
    (or of a list page anywhere else), in the theme the app was last left
    in, removed with a fade on Flutter's first frame.
  -->
  <style>
    #boot {
      --bg: #ffffff; --map: #e9edf1; --map2: #dde3e9; --sheet: #ffffff; --block: #e6e9ee; --shine: rgba(255,255,255,.65);
      position: fixed; inset: 0; z-index: 9999; background: var(--bg); overflow: hidden;
      transition: opacity .25s ease;
      font: 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #boot.dark {
      --bg: #0b0f17; --map: #161b23; --map2: #1d232d; --sheet: #121212; --block: #232a35; --shine: rgba(255,255,255,.06);
    }
    #boot.gone { opacity: 0; pointer-events: none; }
    #boot .map { position: absolute; inset: 0;
      background: linear-gradient(115deg, transparent 48%, var(--map2) 48% 50%, transparent 50%) 0 0 / 220px 220px,
                  linear-gradient(25deg, transparent 62%, var(--map2) 62% 63.5%, transparent 63.5%) 0 0 / 300px 300px,
                  var(--map); }
    #boot .b { background: var(--block); border-radius: 10px; position: relative; overflow: hidden; }
    #boot .b::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, var(--shine), transparent); animation: boot-shine 1.4s infinite; }
    @keyframes boot-shine { to { transform: translateX(100%); } }
    @media (prefers-reduced-motion: reduce) { #boot .b::after { animation: none; } #boot { transition: none; } }
    #boot .menu { position: absolute; top: 16px; left: 16px; width: 40px; height: 40px; border-radius: 50%; }
    #boot .pin { position: absolute; left: 50%; top: 34%; width: 28px; height: 28px; margin-left: -14px; border-radius: 50%; }
    #boot .sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 34%; min-height: 230px; background: var(--sheet);
      border-radius: 20px 20px 0 0; box-shadow: 0 -4px 18px rgba(0,0,0,.12); padding: 10px 16px 16px; box-sizing: border-box; }
    #boot .handle { width: 36px; height: 4px; border-radius: 2px; margin: 0 auto 16px; }
    #boot .row { display: flex; gap: 10px; margin-bottom: 14px; }
    #boot .chip { flex: 1; height: 64px; }
    #boot .pill { height: 52px; border-radius: 26px; margin-bottom: 16px; }
    #boot .line { height: 14px; margin-bottom: 12px; }
    #boot .bar { height: 56px; border-radius: 0; margin: -16px -16px 16px; }
    #boot .list { position: absolute; inset: 0; padding: 16px; box-sizing: border-box; max-width: 760px; margin: 0 auto; }
    #boot .item { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; }
    #boot .dot { width: 40px; height: 40px; border-radius: 50%; flex: none; }
    #boot .grow { flex: 1; }
    @media (min-width: 900px) {
      #boot .sheet { left: 16px; right: auto; top: 16px; bottom: 16px; width: 380px; height: auto; border-radius: 16px; }
      #boot .menu { display: none; }
      #boot .pin { left: calc(50% + 200px); top: 50%; }
    }
  </style>
</head>
<body>
  <div id="boot" aria-busy="true" aria-label="Loading GET.ride">
    <script>
      (function () {
        var boot = document.getElementById('boot');
        // The theme the app was last left in (SharedPreferences on the web is
        // localStorage, JSON-encoded), else the system's.
        var mode = '';
        try { mode = String(JSON.parse(localStorage.getItem('flutter.theme_mode') || '""')); } catch (e) {}
        var dark = mode === 'dark' ||
          (mode !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) boot.classList.add('dark');
        var home = location.pathname === '/' || location.pathname === '';
        boot.insertAdjacentHTML('beforeend', home
          ? '<div class="map"></div><div class="b menu"></div><div class="b pin"></div>' +
            '<div class="sheet"><div class="b handle"></div>' +
            '<div class="row"><div class="b chip"></div><div class="b chip"></div><div class="b chip"></div><div class="b chip"></div></div>' +
            '<div class="b pill"></div><div class="b line" style="width:70%"></div><div class="b line" style="width:45%"></div></div>'
          : '<div class="list"><div class="b bar"></div>' +
            new Array(7).join('<div class="item"><div class="b dot"></div><div class="grow">' +
              '<div class="b line" style="width:60%"></div><div class="b line" style="width:35%;margin:0"></div></div></div>') +
            '</div>');
        function done() {
          window.removeEventListener('flutter-first-frame', done);
          boot.classList.add('gone');
          setTimeout(function () { boot.remove(); }, 300);
        }
        window.addEventListener('flutter-first-frame', done);
      })();
    </script>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
